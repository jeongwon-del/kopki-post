<style>
[hidden]{display:none!important}
/* 한 줄 가로 스트립 + 클릭하면 크게 보기 */
:root{
  --bg:#efede9; --paper:#f8f7f4; --ink:#26241f; --sub:#77736b; --line:#d9d5ce; --hl:#ffe45c;
  --sans:"Noto Sans KR",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1f1e1c;--paper:#2a2926;--ink:#eeebe5;--sub:#a29d94;--line:#3b3935;--hl:#8a7514;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1f1e1c;--paper:#2a2926;--ink:#eeebe5;--sub:#a29d94;--line:#3b3935;--hl:#8a7514;color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--sans)}
.wrap{max-width:1180px;margin:0 auto;min-height:100vh;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding-block:40px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;color:var(--sub);text-transform:uppercase}
h1{font-size:24px;font-weight:700;margin:8px 0 6px;text-wrap:balance}
h1 mark{background:linear-gradient(transparent 58%,var(--hl) 58%);color:inherit;padding:0 2px}
.meta{font-size:14px;color:var(--sub);display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;justify-content:center}
.meta a{color:var(--ink);text-underline-offset:3px}
.strip{margin-top:28px;display:flex;gap:14px;overflow-x:auto;padding-bottom:12px;scroll-snap-type:x mandatory;max-width:100%;justify-content:safe center}
.card{flex:0 0 auto;width:200px;text-align:left;scroll-snap-align:start;display:flex;flex-direction:column;gap:8px;text-decoration:none;color:inherit}
.card img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block;border:1px solid var(--line);background:var(--paper);transition:transform .15s}
.card:hover img,.card:focus-visible img{transform:translateY(-3px)}
.card:focus-visible{outline:2px solid var(--ink);outline-offset:4px}
.cap{font-family:var(--mono);font-size:12px;color:var(--sub)}
.hint{font-size:13px;color:var(--sub);margin-top:6px}
.lb{position:fixed;inset:0;background:rgba(20,19,17,.82);display:flex;align-items:center;justify-content:center;z-index:20;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.lb img{max-height:86vh;max-width:min(560px,100%);width:auto;display:block}
.lb .bar{position:absolute;bottom:max(14px,env(safe-area-inset-bottom,0px));left:0;right:0;display:flex;justify-content:center;gap:10px}
.lb button{font-family:var(--mono);font-size:13px;background:#f8f7f4;color:#26241f;border:0;padding:8px 14px;cursor:pointer}
.lb button:focus-visible{outline:2px solid var(--hl);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.card img{transition:none}}
</style>
